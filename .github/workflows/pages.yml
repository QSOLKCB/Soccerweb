name: Verify and deploy SOCCERWEB
on:
  push:
    branches: [main]
    paths: ['**.mjs', '**.js', '**.html', '**.css', '**.svg', '**.webmanifest', 'tests/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soccerweb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native deterministic regression suite
        run: node --test tests/*.test.mjs
      - name: Seeded gameplay measurements
        run: |
          mkdir -p work/browser
          node tests/gameplay_report.mjs > work/browser/gameplay-report.json
          node tests/season_report.mjs > work/browser/season-report.json
          node tests/audio_artifacts.mjs > work/browser/audio-summary.json
      - name: Install browser test tooling (not shipped with the game)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium firefox
      - name: Configure a virtual audio output for headless browser graph tests
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=soccerweb_ci
          pactl set-default-sink soccerweb_ci
          pactl list short sinks > work/browser/audio-sinks.txt
          lscpu > work/browser/runner-cpu.txt
          python tests/audio_device_smoke.py
      - name: Real browser, gameplay, replay and offline smoke tests
        run: python tests/browser_smoke.py
      - name: Sustained input and stage measurements (Chromium)
        run: python tests/matchday_browser.py
      - name: Firefox full match and matchday checks
        run: |
          BROWSER=firefox python tests/browser_smoke.py
          BROWSER=firefox python tests/matchday_browser.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            work/browser/
            work/matchday/
      - name: Package static files
        run: python tests/package.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site
  goalposts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling and virtual audio output
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium firefox
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=goalposts_ci
          pactl set-default-sink goalposts_ci
      - name: Play all stages, replay, failure, retry and offline (Chromium)
        run: python tests/goalposts_browser.py
      - name: Play all stages, replay, failure, retry and offline (Firefox)
        run: BROWSER=firefox python tests/goalposts_browser.py
      - name: Save GOALPOSTS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goalposts-evidence
          path: work/goalposts-browser/
  deploy:
    # PRs and manual feature-branch runs can never deploy to production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, goalposts]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static release
        id: deployment
        uses: actions/deploy-pages@v4
