name: Verify and deploy SOCCERWEB
on:
  push:
    branches: [main]
    paths: ['**.mjs', '**.js', '**.html', '**.css', '**.svg', '**.webmanifest', 'tests/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soccerweb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native deterministic regression suite
        run: node --test tests/*.test.mjs
      - name: Install browser test tooling (not shipped with the game)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real browser, gameplay, replay and offline smoke tests
        run: python tests/browser_smoke.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: work/browser/
      - name: Package static files
        run: python tests/package.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/site
  deploy:
    # PRs and manual feature-branch runs can never deploy to production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static release
        id: deployment
        uses: actions/deploy-pages@v4
