name: Tournament lab smoke
on:
  pull_request:
  push:
    branches: [main]
    paths: ['tools/**', 'tests/tournament*', 'game/**', 'simulation/**', 'ai/**', 'replay/**', '.github/workflows/tournament-smoke.yml']
permissions:
  contents: read
concurrency:
  group: tournament-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Bounded runner, merge, schema, report and optional vision tests
        run: node --test tests/tournament.test.mjs
      - name: Exact 96-fixture regression and small verified sweep
        run: |
          mkdir -p work/tournament-ci
          node tests/tournament_golden.mjs work/tournament-ci/golden.json
          node tools/tournament_lab.mjs --out work/tournament-ci/smoke --max-fixtures 24 --seconds 20 --verify --budget-seconds 120
          node tools/vision_audit.mjs --out work/tournament-ci/vision-disabled
      - name: Install pinned development browser tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium firefox
      - name: Sparse genuine Canvas captures and native/browser hash comparison
        run: |
          python tools/tournament_capture.py --run work/tournament-ci/smoke --out work/tournament-ci/chromium --limit 2 --controls 1
          python tools/tournament_capture.py --run work/tournament-ci/smoke --out work/tournament-ci/firefox --limit 1 --controls 1 --browser firefox
      - name: Enforce artifact size cap
        id: size
        if: always()
        run: test "$(du -sm work/tournament-ci | cut -f1)" -le 128
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.size.outcome == 'success'
        with:
          name: tournament-smoke-evidence
          path: work/tournament-ci/
          retention-days: 7
          compression-level: 9
